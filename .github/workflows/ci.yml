name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

# Least privilege: the check job only needs to read the repository.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.11

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Advisory gate: fails on critical advisories only. The dependency tree
      # currently carries pre-existing high advisories in dev tooling, so a
      # `--audit-level=high` gate would block every build until those packages
      # are upgraded (tracked as follow-up work).
      - name: Audit dependencies
        run: bun audit --audit-level=critical

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test:run

      - name: Build
        run: bun run build

      - name: Check formatting
        run: bun run format:check
